[project]
name = "llm-engineering-lab"
version = "0.1.0"
description = "LLM Engineering course projects, rebuilt and extended."
readme = "README.md"
license = "MIT"
authors = [{ name = "Islam Moussa" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "openai>=3.0,<4",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
]

[dependency-groups]
dev = [
    "httpx2",  # the openai SDK's HTTP layer; used by the adapter contract tests
    "ipykernel>=6.29",
    "nbstripout>=0.9",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Each week's package lives in its own folder; hatch maps them to top-level imports.
packages = ["labkit", "week1-brochure/src/week1_brochure"]
exclude = ["labkit/tests"]

[tool.pytest.ini_options]
testpaths = ["labkit/tests", "week1-brochure/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["labkit", "week1_brochure"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
